name: build-portmidi

on:
  push:
  workflow_dispatch:

env:
  PORTMIDI_TAG: v2.0.4   # check github.com/PortMidi/portmidi/tags and edit if needed

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get PortMidi source
        run: git clone --depth 1 --branch ${{ env.PORTMIDI_TAG }} https://github.com/PortMidi/portmidi src

      - name: Linux deps (ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Collect binaries
        shell: bash
        run: |
          mkdir out
          find build \( -name "*.so*" -o -name "*.dll" \) -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmidi-${{ matrix.os }}
          path: out/*
